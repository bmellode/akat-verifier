<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AKAT Score Verifier</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#0A1929;min-height:100vh;
     display:flex;flex-direction:column;align-items:center;padding:16px}
h1{color:#E8C96A;font-size:1.25rem;font-weight:700;text-align:center;margin:12px 0 2px}
.sub{color:#8A9BB0;font-size:.8rem;text-align:center;margin-bottom:16px}

/* ── SCAN AREA ── */
.scan-card{background:#112240;border-radius:16px;padding:16px;width:100%;max-width:440px;
           box-shadow:0 4px 24px rgba(0,0,0,.4)}
#video-wrap{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;
            overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
#video{width:100%;height:100%;object-fit:cover;display:block}
.corner{position:absolute;width:36px;height:36px;border-color:#E8C96A;border-style:solid}
.tl{top:10px;left:10px;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.tr{top:10px;right:10px;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.bl{bottom:10px;left:10px;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.br{bottom:10px;right:10px;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scan-line{position:absolute;left:10px;right:10px;height:2px;background:#E8C96A;
           opacity:.8;animation:scanmove 2s linear infinite;top:10px}
@keyframes scanmove{0%{top:10px}100%{top:calc(100% - 12px)}}
#cam-placeholder{color:#8A9BB0;font-size:.85rem;text-align:center;padding:20px}

.btn-scan{width:100%;margin-top:12px;padding:14px;background:#C9A84C;color:#0D2137;
          border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;
          display:flex;align-items:center;justify-content:center;gap:8px}
.btn-scan:active{background:#E8C96A}
.btn-scan.stop{background:#163352;color:#E8C96A;border:1.5px solid #C9A84C}

.hint{color:#8A9BB0;font-size:.78rem;text-align:center;margin-top:8px}

/* ── RESULT ── */
#result{width:100%;max-width:440px;margin-top:14px;display:none}
.r-box{border-radius:12px;padding:16px 18px;margin-bottom:10px}
.valid  {background:#0d2e1c;border:1.5px solid #2ECC71}
.invalid{background:#2e0d0d;border:1.5px solid #E74C3C}
.warning{background:#2e250d;border:1.5px solid #F39C12}
.r-icon {font-size:2rem;margin-bottom:6px;text-align:center}
.r-title{font-size:1rem;font-weight:700;text-align:center;margin-bottom:4px}
.valid   .r-title{color:#2ECC71}
.invalid .r-title{color:#E74C3C}
.warning .r-title{color:#F39C12}
.r-desc {font-size:.82rem;color:#aaa;text-align:center}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.info-item{background:#0A1929;border-radius:8px;padding:10px 12px}
.info-item.full{grid-column:1/-1}
.i-label{font-size:.72rem;color:#8A9BB0;margin-bottom:3px;font-weight:600}
.i-value{font-size:.92rem;font-weight:700;color:#E8C96A}
.score-row{display:flex;gap:8px;margin-top:8px}
.score-box{flex:1;text-align:center;background:#0D2137;border-radius:8px;padding:12px 8px}
.s-label{font-size:.7rem;color:#8A9BB0;margin-bottom:4px}
.s-val  {font-size:1.5rem;font-weight:800;color:#E8C96A}

.btn-rescan{width:100%;padding:12px;background:#163352;color:#E8C96A;
            border:1.5px solid #C9A84C;border-radius:10px;font-size:.95rem;
            font-weight:700;cursor:pointer;margin-top:6px}
.btn-rescan:active{background:#1A3353}

.footer{color:#3a4f65;font-size:.72rem;text-align:center;margin-top:20px;padding-bottom:20px}
</style>
</head>
<body>
<h1>AKAT Score Verifier</h1>
<p class="sub">ระบบตรวจสอบรายงานผลสอบ — สแกน QR ได้เลย</p>

<div class="scan-card">
  <div id="video-wrap">
    <div id="cam-placeholder">กด "เปิดกล้องสแกน QR" ด้านล่าง</div>
    <video id="video" autoplay playsinline muted style="display:none"></video>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scan-line" id="scan-line" style="display:none"></div>
  </div>
  <button class="btn-scan" id="btn-scan" onclick="toggleCamera()">
    <span>📷</span><span>เปิดกล้องสแกน QR</span>
  </button>
  <p class="hint" id="hint-text">ส่อง QR Code ที่มุมขวาบนของรายงานผล</p>
</div>

<div id="result"></div>

<div class="footer">AKAT Score Report Verification System<br>
Srinakharinwirot University — Educational and Psychological Test Bureau</div>

let stream = null;
let scanning = false;
let animFrame = null;
const video = document.getElementById("video");
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");

async function toggleCamera() {
  if (scanning) { stopCamera(); return; }
  await startCamera();
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = stream;
    video.style.display = "block";
    document.getElementById("cam-placeholder").style.display = "none";
    document.getElementById("scan-line").style.display = "block";
    const btn = document.getElementById("btn-scan");
    btn.innerHTML = "<span>⏹</span><span>หยุดกล้อง</span>";
    btn.classList.add("stop");
    document.getElementById("hint-text").textContent = "กำลังสแกน... ส่อง QR ให้อยู่ในกรอบ";
    scanning = true;
    requestAnimationFrame(scanFrame);
  } catch(e) {
    alert("ไม่สามารถเปิดกล้องได้\n" + e.message +
          "\n\nกรุณาอนุญาต Permission กล้องในเบราว์เซอร์");
  }
}

function stopCamera() {
  scanning = false;
  if (animFrame) cancelAnimationFrame(animFrame);
  if (stream) stream.getTracks().forEach(t => t.stop());
  video.style.display = "none";
  document.getElementById("cam-placeholder").style.display = "flex";
  document.getElementById("scan-line").style.display = "none";
  const btn = document.getElementById("btn-scan");
  btn.innerHTML = "<span>📷</span><span>สแกนใหม่อีกครั้ง</span>";
  btn.classList.remove("stop");
  document.getElementById("hint-text").textContent = "ส่อง QR Code ที่มุมขวาบนของรายงานผล";
}

function scanFrame() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imgData.data, imgData.width, imgData.height,
                      { inversionAttempts: "dontInvert" });
    if (code) {
      stopCamera();
      processQR(code.data);
      return;
    }
  }
  animFrame = requestAnimationFrame(scanFrame);
}

// ── Verify ──────────────────────────────────
async function getPublicKey() {
  const bin = Uint8Array.from(atob(PUBLIC_KEY_B64), c => c.charCodeAt(0));
  return crypto.subtle.importKey("spki", bin.buffer,
    { name:"ECDSA", namedCurve:"P-256" }, false, ["verify"]);
}

function b64u(s) {
  const b = s.replace(/-/g,"+").replace(/_/g,"/");
  return Uint8Array.from(atob(b + "=".repeat((4-b.length%4)%4)), c => c.charCodeAt(0));
}

async function processQR(raw) {
  const res = document.getElementById("result");
  res.style.display = "block";
  res.scrollIntoView({ behavior:"smooth", block:"start" });

  let data;
  try { data = JSON.parse(raw); }
  catch { res.innerHTML = box("invalid","❌","อ่าน QR ไม่ได้","ข้อมูลใน QR ไม่ถูกต้อง") + rescanBtn(); return; }

  const req = ["ID","N","G","A","D","V","FULL_SIG"];
  const miss = req.filter(k => !data[k]);
  if (miss.length) {
    res.innerHTML = box("invalid","❌","QR ไม่สมบูรณ์",`ขาดข้อมูล: ${miss.join(", ")}`) + rescanBtn();
    return;
  }

  const today = new Date().toISOString().split("T")[0];
  const expired = data.V < today;
  let sigValid = null;

  if (PUBLIC_KEY_B64 !== "PASTE_PUBLIC_KEY_BASE64_HERE") {
    try {
      const pub = await getPublicKey();
      const pd  = {ID:data.ID,N:data.N,S:data.S||"",G:data.G,A:data.A,D:data.D,V:data.V};
      const str = Object.keys(pd).sort().map(k=>`${k}:${pd[k]}`).join("|");
      sigValid  = await crypto.subtle.verify(
        {name:"ECDSA",hash:"SHA-256"}, pub,
        b64u(data.FULL_SIG), new TextEncoder().encode(str));
    } catch { sigValid = false; }
  }

  let statusHtml = "";
  if (sigValid === null) {
    statusHtml = box("warning","⚠️","ยังไม่ได้ตั้งค่า Public Key","แสดงข้อมูลเท่านั้น ยังไม่สามารถยืนยัน Signature");
  } else if (!sigValid) {
    statusHtml = box("invalid","❌","ลายเซ็นไม่ถูกต้อง","เอกสารนี้อาจถูกปลอมแปลง ห้ามรับเอกสารฉบับนี้");
  } else if (expired) {
    statusHtml = box("warning","⚠️","เอกสารหมดอายุ",`ลายเซ็นถูกต้อง แต่หมดอายุเมื่อ ${data.V}`);
  } else {
    statusHtml = box("valid","✅","เอกสารถูกต้อง ยืนยันแล้ว","ลายเซ็นดิจิทัลถูกต้อง และยังไม่หมดอายุ");
  }

  const infoHtml = `
    <div class="info-grid">
      <div class="info-item full">
        <div class="i-label">ชื่อ - นามสกุล</div>
        <div class="i-value">${esc(data.N)}</div>
      </div>
      <div class="info-item">
        <div class="i-label">Examination ID</div>
        <div class="i-value">${esc(data.ID)}</div>
      </div>
      <div class="info-item">
        <div class="i-label">วันที่สอบ</div>
        <div class="i-value">${esc(data.D)}</div>
      </div>
      <div class="info-item full">
        <div class="i-label">โรงเรียน</div>
        <div class="i-value">${esc(data.S||"-")}</div>
      </div>
    </div>
    <div class="score-row">
      <div class="score-box">
        <div class="s-label">General Aptitude</div>
        <div class="s-val">${esc(data.G)}</div>
      </div>
      <div class="score-box">
        <div class="s-label">Academic Aptitude</div>
        <div class="s-val">${esc(data.A)}</div>
      </div>
    </div>`;

  res.innerHTML = statusHtml + infoHtml + rescanBtn();
}

function box(cls, icon, title, desc) {
  return `<div class="r-box ${cls}">
    <div class="r-icon">${icon}</div>
    <div class="r-title">${title}</div>
    <div class="r-desc">${desc}</div>
  </div>`;
}
function rescanBtn() {
  return `<button class="btn-rescan" onclick="rescan()">📷 สแกนใหม่</button>`;
}
function rescan() {
  document.getElementById("result").style.display = "none";
  document.getElementById("result").innerHTML = "";
  startCamera();
}
function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// เตือนถ้าไม่มี HTTPS (กล้องไม่ทำงานบน HTTP)
window.addEventListener("load", () => {
  if (location.protocol === "file:") {
    document.getElementById("hint-text").textContent =
      "เปิดจากไฟล์โดยตรง — กล้องอาจไม่ทำงานบน Android กรุณาส่งทาง Line แล้วเปิดใน Browser";
  }
});
</script>
